<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>即時影像 monitoring</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --soft: #57534e;
      --card: #1c1917; --bd: #292524; --bd2: #44403c;
      --accent: #e7e5e4; --accent2: #d6d3d1;
      --tag-bg: #292524; --tag-fg: #d6d3d1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1400px; margin: 0 auto;
      padding: 28px 20px 0; text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .sub a { color: var(--accent2); text-decoration: none; }
    .sub a:hover { text-decoration: underline; }

    .reload-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 16px;
      padding: 6px 14px;
      font: inherit; font-size: 13px;
      background: var(--card); color: var(--fg);
      border: 1px solid var(--bd2); border-radius: 8px;
      cursor: pointer;
    }
    .reload-btn:hover { background: var(--bd); border-color: var(--accent); }
    .reload-btn:active { transform: translateY(1px); }
    .reload-btn svg { width: 14px; height: 14px; fill: currentColor; }

    .grid {
      max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px;
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 320px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 550px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }

    /* 南北向左右分欄 */
    .pair {
      max-width: 1400px; margin: 0 auto;
      padding: 12px 16px 40px;
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
    }
    /* 手機(<720px):整體 2 欄 × 4 列,北上南下左右各一欄 */
    @media (max-width: 719px) {
      .pair { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 8px 24px; }
      .col { padding: 0; border: 0 !important; }
      .col-title { font-size: 11px; padding: 2px 2px 6px; text-align: center; }
      .col-grid { gap: 8px; }
      .cam { max-width: 100%; }
      .cam-head { padding: 6px 6px 4px; gap: 6px; }
      .cam-name { font-size: 10.5px; }
      .cam-loc { display: none; }
      .cam-foot { padding: 3px 6px 5px; font-size: 9.5px; }
      .cam-link { gap: 2px; }
    }
    /* 寬螢幕(≥720px):左右兩大欄(北上/南下語意區隔),每欄內 4 直 */
    @media (min-width: 720px) {
      .pair {
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .col { border-left: 1px solid var(--bd); padding-left: 18px; }
    }
    .col-title {
      font-size: 12px; font-weight: 600;
      color: var(--muted); letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 2px 8px;
    }
    .col-grid {
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
    }

    .cam {
      background: var(--card); border: 1px solid var(--bd);
      border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .cam-head {
      padding: 10px 14px 8px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--bd);
    }
    .cam-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }
    .cam-name {
      font-size: 13.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .cam-loc {
      font-size: 11.5px; color: var(--muted); flex-shrink: 0;
    }
    .cam-body {
      position: relative; width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .cam-body img,
    .cam-body video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .cam-body .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--soft); font-size: 13px;
    }
    .cam-foot {
      padding: 6px 14px 8px;
      font-size: 11px; color: var(--soft);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cam-foot a {
      color: var(--accent2); text-decoration: none;
    }
    .cam-foot a:hover { text-decoration: underline; }
    .cam-link {
      display: inline-flex; align-items: center; gap: 3px;
    }

    footer {
      max-width: 1400px; margin: 0 auto;
      padding: 16px 20px 28px;
      border-top: 1px solid var(--bd);
      font-size: 12px; color: var(--soft);
      text-align: center;
    }
    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 639px) {
      .cam-head { padding: 8px 12px 6px; }
      .cam-name { font-size: 12.5px; }
      .cam-loc { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📡 即時影像 monitoring</h1>
    <p class="sub">
      共 <span id="count"></span> 攝影機 ·
      <a href="../">← 返回 hub</a>
    </p>
    <button class="reload-btn" id="reload" type="button" title="重新整理整頁">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      重整
    </button>
  </header>

  <div class="pair" id="pair"></div>

  <footer>
    影像來源為各政府機關公開資料 ·
    Hosted on GitHub Pages ·
    <a href="https://github.com/taiwanbestphoto/pages" target="_blank" rel="noopener">source</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    // ============================================================
    //  CAMERAS — 新增攝影機只需複製一筆，修改對應欄位即可
    // ============================================================
    // 國道1號 楊梅↔桃園段 49K–75K,左右欄各 4 隻(2 欄 × 4 列)
        // 高公局鏡頭為 MJPEG stream,使用 image type(<img> + 8 秒 cache buster 刷新)
        const CAMERAS = [
          // ── 左欄:北上主線(楊梅→桃園北行,里程由大到小) ──
          {
            id:   "CCTV-N1-N-74.500-M",
            name: "國道1號 北向 74K+500",
            loc:  "湖口交流道→高架楊梅端",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=17450",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "N",
          },
          {
            id:   "CCTV-N1-N-64.600-M",
            name: "國道1號 北向 64K+600",
            loc:  "平鎮系統交流道→中壢交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16460",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "N",
          },
          {
            id:   "CCTV-N1-N-56.980-M",
            name: "國道1號 北向 56K+980",
            loc:  "內壢交流道→中壢服務區",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15690",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "N",
          },
          {
            id:   "CCTV-N1-N-49.000-M",
            name: "國道1號 北向 49K+000",
            loc:  "桃園交流道→林口交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=14900",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "N",
          },
          // ── 右欄:南下主線(楊梅→桃園南行,里程由大到小) ──
          {
            id:   "CCTV-N1-S-72.675-M",
            name: "國道1號 南向 72K+675",
            loc:  "高架楊梅端→湖口交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=17260",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "S",
          },
          {
            id:   "CCTV-N1-S-64.000-M",
            name: "國道1號 南向 64K+000",
            loc:  "中壢交流道→平鎮系統交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16400",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "S",
          },
          {
            id:   "CCTV-N1-S-55.000-M",
            name: "國道1號 南向 55K+000",
            loc:  "機場系統交流道→中壢服務區",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15500",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "S",
          },
          {
            id:   "CCTV-N1-S-51.380-M",
            name: "國道1號 南向 51K+380",
            loc:  "桃園交流道→機場系統交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15130",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
            col:  "S",
          },
          // 之後新增往下加 ...
        ];

    // ===== escape =====
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    // ===== render =====
    const pair = document.getElementById("pair");
    document.getElementById("count").textContent = CAMERAS.length;

    // 建左右兩欄容器
    function makeCol(title) {
      const col = document.createElement("div");
      col.className = "col";
      const h = document.createElement("div");
      h.className = "col-title";
      h.textContent = title;
      col.appendChild(h);
      const g = document.createElement("div");
      g.className = "col-grid";
      col.appendChild(g);
      return { col, grid: g };
    }
    const left  = makeCol("北向(楊梅→桃園)");
    const right = makeCol("南向(楊梅→桃園)");
    pair.appendChild(left.col);
    pair.appendChild(right.col);

    function buildCard(cam, container) {
      const div = document.createElement("div");
      div.className = "cam";
      div.innerHTML = `
        <div class="cam-head">
          <span class="cam-dot"></span>
          <span class="cam-name">${esc(cam.name)}</span>
          <span class="cam-loc">${esc(cam.loc)}</span>
        </div>
        <div class="cam-body" id="body-${esc(cam.id)}">
          <span class="placeholder">載入中…</span>
        </div>
        <div class="cam-foot">
          <span>${esc(cam.from)}</span>
          <a class="cam-link" href="${esc(cam.url)}" target="_blank" rel="noopener">tw.live ↗</a>
        </div>`;
      container.appendChild(div);

      const body = div.querySelector(".cam-body");

      if (cam.type === "image") {
        const img = document.createElement("img");
        img.src = cam.src;
        img.alt = cam.name;
        img.loading = "lazy";
        img.onload = () => body.querySelector(".placeholder")?.remove();
        img.onerror = () => {
          body.querySelector(".placeholder").textContent = "影像載入失敗";
        };
        body.appendChild(img);
        // 靜態快照自動刷新
        setInterval(() => { img.src = cam.src + "?t=" + Date.now(); }, 8000);
      }

      if (cam.type === "hls") {
        const video = document.createElement("video");
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        video.setAttribute("playsinline", "");
        body.appendChild(video);

        if (Hls.isSupported()) {
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          hls.loadSource(cam.src);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            body.querySelector(".placeholder")?.remove();
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) {
              body.querySelector(".placeholder").textContent = "串流載入失敗";
            }
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Safari 原生 HLS
          video.src = cam.src;
          video.addEventListener("loadeddata", () => {
            body.querySelector(".placeholder")?.remove();
          });
          video.addEventListener("error", () => {
            body.querySelector(".placeholder").textContent = "串流載入失敗";
          });
        } else {
          body.querySelector(".placeholder").textContent = "瀏覽器不支援 HLS";
        }
      }
    }

    CAMERAS.forEach(cam => {
      buildCard(cam, cam.col === "N" ? left.grid : right.grid);
    });

    // ===== 重整鈕 =====
    document.getElementById("reload").addEventListener("click", () => {
      // 強制從伺服器重抓,不走 cache
      location.reload();
    });
  </script>
</body>
</html>
