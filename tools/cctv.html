<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>即時影像 monitoring</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --soft: #57534e;
      --card: #1c1917; --bd: #292524; --bd2: #44403c;
      --accent: #e7e5e4; --accent2: #d6d3d1;
      --tag-bg: #292524; --tag-fg: #d6d3d1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1400px; margin: 0 auto;
      padding: 28px 20px 0; text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .sub a { color: var(--accent2); text-decoration: none; }
    .sub a:hover { text-decoration: underline; }

    .reload-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0 0 16px;
      padding: 6px 14px;
      font: inherit; font-size: 13px;
      background: var(--card); color: var(--fg);
      border: 1px solid var(--bd2); border-radius: 8px;
      cursor: pointer;
    }
    .reload-btn:hover { background: var(--bd); border-color: var(--accent); }
    .reload-btn:active { transform: translateY(1px); }
    .reload-btn svg { width: 14px; height: 14px; fill: currentColor; }

    .grid {
      max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px;
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 320px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 550px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }

    .cam {
      background: var(--card); border: 1px solid var(--bd);
      border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .cam-head {
      padding: 10px 14px 8px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--bd);
    }
    .cam-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }
    .cam-name {
      font-size: 13.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .cam-loc {
      font-size: 11.5px; color: var(--muted); flex-shrink: 0;
    }
    .cam-body {
      position: relative; width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .cam-body img,
    .cam-body video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .cam-body .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--soft); font-size: 13px;
    }
    .cam-foot {
      padding: 6px 14px 8px;
      font-size: 11px; color: var(--soft);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cam-foot a {
      color: var(--accent2); text-decoration: none;
    }
    .cam-foot a:hover { text-decoration: underline; }
    .cam-link {
      display: inline-flex; align-items: center; gap: 3px;
    }

    footer {
      max-width: 1400px; margin: 0 auto;
      padding: 16px 20px 28px;
      border-top: 1px solid var(--bd);
      font-size: 12px; color: var(--soft);
      text-align: center;
    }
    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 639px) {
      .cam-head { padding: 8px 12px 6px; }
      .cam-name { font-size: 12.5px; }
      .cam-loc { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📡 即時影像 monitoring</h1>
    <p class="sub">
      共 <span id="count"></span> 攝影機 ·
      <a href="../">← 返回 hub</a>
    </p>
    <button class="reload-btn" id="reload" type="button" title="重新整理整頁">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      重整
    </button>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    影像來源為各政府機關公開資料 ·
    Hosted on GitHub Pages ·
    <a href="https://github.com/taiwanbestphoto/pages" target="_blank" rel="noopener">source</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    // ============================================================
    //  CAMERAS — 新增攝影機只需複製一筆，修改對應欄位即可
    // ============================================================
    // 國道1號 楊梅→桃園段,南向 51K–69K,主線 9 支 + 中壢服務區 1 支
        // 高公局鏡頭為 MJPEG stream,使用 image type(<img> + 8 秒 cache buster 刷新)
        const CAMERAS = [
          {
            id:   "CCTV-N1-S-69.190-M",
            name: "國道1號 南向 69K+190",
            loc:  "幼獅交流道→楊梅交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16910",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-67.395-M",
            name: "國道1號 南向 67K+395",
            loc:  "幼獅交流道→楊梅交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16731",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-65.920-M",
            name: "國道1號 南向 65K+920",
            loc:  "平鎮系統交流道→幼獅交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16590",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-64.000-M",
            name: "國道1號 南向 64K+000",
            loc:  "中壢交流道→平鎮系統交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16400",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-62.205-M",
            name: "國道1號 南向 62K+205",
            loc:  "中壢轉接二→中壢交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=16220",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-57.950-M",
            name: "國道1號 南向 57K+950",
            loc:  "內壢交流道→中壢轉接一",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15790",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-55-R-中壢服務區-涵洞口",
            name: "國道1號 南向 55K 中壢服務區",
            loc:  "中壢服務區",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15501",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-55.000-M",
            name: "國道1號 南向 55K+000",
            loc:  "機場系統交流道→中壢服務區",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15500",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-52.800-M",
            name: "國道1號 南向 52K+770",
            loc:  "機場系統交流道→中壢服務區",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15280",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          {
            id:   "CCTV-N1-S-51.380-M",
            name: "國道1號 南向 51K+380",
            loc:  "桃園交流道→機場系統交流道",
            src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=15130",
            type: "image",
            url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
            from: "高公局",
          },
          // 之後新增往下加 ...
        ];

    // ===== escape =====
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    // ===== render =====
    const grid = document.getElementById("grid");
    document.getElementById("count").textContent = CAMERAS.length;

    CAMERAS.forEach(cam => {
      const div = document.createElement("div");
      div.className = "cam";
      div.innerHTML = `
        <div class="cam-head">
          <span class="cam-dot"></span>
          <span class="cam-name">${esc(cam.name)}</span>
          <span class="cam-loc">${esc(cam.loc)}</span>
        </div>
        <div class="cam-body" id="body-${esc(cam.id)}">
          <span class="placeholder">載入中…</span>
        </div>
        <div class="cam-foot">
          <span>${esc(cam.from)}</span>
          <a class="cam-link" href="${esc(cam.url)}" target="_blank" rel="noopener">tw.live ↗</a>
        </div>`;
      grid.appendChild(div);

      const body = div.querySelector(".cam-body");

      if (cam.type === "image") {
        const img = document.createElement("img");
        img.src = cam.src;
        img.alt = cam.name;
        img.loading = "lazy";
        img.onload = () => body.querySelector(".placeholder")?.remove();
        img.onerror = () => {
          body.querySelector(".placeholder").textContent = "影像載入失敗";
        };
        body.appendChild(img);
        // 靜態快照自動刷新
        setInterval(() => { img.src = cam.src + "?t=" + Date.now(); }, 8000);
      }

      if (cam.type === "hls") {
        const video = document.createElement("video");
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        video.setAttribute("playsinline", "");
        body.appendChild(video);

        if (Hls.isSupported()) {
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          hls.loadSource(cam.src);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            body.querySelector(".placeholder")?.remove();
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) {
              body.querySelector(".placeholder").textContent = "串流載入失敗";
            }
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Safari 原生 HLS
          video.src = cam.src;
          video.addEventListener("loadeddata", () => {
            body.querySelector(".placeholder")?.remove();
          });
          video.addEventListener("error", () => {
            body.querySelector(".placeholder").textContent = "串流載入失敗";
          });
        } else {
          body.querySelector(".placeholder").textContent = "瀏覽器不支援 HLS";
        }
      }
    });

    // ===== 重整鈕 =====
    document.getElementById("reload").addEventListener("click", () => {
      // 強制從伺服器重抓,不走 cache
      location.reload();
    });
  </script>
</body>
</html>
