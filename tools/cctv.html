<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>即時影像 monitoring</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --soft: #57534e;
      --card: #1c1917; --bd: #292524; --bd2: #44403c;
      --accent: #e7e5e4; --accent2: #d6d3d1;
      --tag-bg: #292524; --tag-fg: #d6d3d1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1400px; margin: 0 auto;
      padding: 28px 20px 0; text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .sub a { color: var(--accent2); text-decoration: none; }
    .sub a:hover { text-decoration: underline; }

    .grid {
      max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px;
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 320px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 550px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }

    .cam {
      background: var(--card); border: 1px solid var(--bd);
      border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .cam-head {
      padding: 10px 14px 8px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--bd);
    }
    .cam-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }
    .cam-name {
      font-size: 13.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .cam-loc {
      font-size: 11.5px; color: var(--muted); flex-shrink: 0;
    }
    .cam-body {
      position: relative; width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .cam-body img,
    .cam-body video,
    .cam-body canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .cam-body .placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--soft); font-size: 13px;
    }
    .cam-foot {
      padding: 6px 14px 8px;
      font-size: 11px; color: var(--soft);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cam-foot a {
      color: var(--accent2); text-decoration: none;
    }
    .cam-foot a:hover { text-decoration: underline; }
    .cam-link {
      display: inline-flex; align-items: center; gap: 3px;
    }

    footer {
      max-width: 1400px; margin: 0 auto;
      padding: 16px 20px 28px;
      border-top: 1px solid var(--bd);
      font-size: 12px; color: var(--soft);
      text-align: center;
    }
    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 639px) {
      .cam-head { padding: 8px 12px 6px; }
      .cam-name { font-size: 12.5px; }
      .cam-loc { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📡 即時影像 monitoring</h1>
    <p class="sub">
      共 <span id="count"></span> 攝影機 ·
      <a href="../">← 返回 hub</a>
    </p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    影像來源為各政府機關公開資料 ·
    Hosted on GitHub Pages ·
    <a href="https://github.com/taiwanbestphoto/pages" target="_blank" rel="noopener">source</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    // ============================================================
    //  CAMERAS — 新增攝影機只需複製一筆,修改對應欄位即可
    //  type: "image"  靜態快照(每 8 秒刷新)
    //  type: "mjpeg"  MJPEG multipart stream(<img> 直連 + 週期重連)
    //  type: "hls"    HLS 即時串流(hls.js 或 Safari 原生)
    // ============================================================
    // 中山高(國道1號)湖口↔楊梅段,71K–83K,南北向各 3 支
    const CAMERAS = [
      {
        id:   "CCTV-N1-N-73.950-M",
        name: "國道1號 北向 73.95K",
        loc:  "楊梅段",
        src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=17390",
        type: "mjpeg",
        url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
        from: "高公局",
      },
      {
        id:   "CCTV-N1-N-77.530-M",
        name: "國道1號 北向 77.53K",
        loc:  "楊梅段",
        src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=17750",
        type: "mjpeg",
        url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
        from: "高公局",
      },
      {
        id:   "CCTV-N1-N-81.100-M",
        name: "國道1號 北向 81.1K",
        loc:  "湖口段",
        src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=18110",
        type: "mjpeg",
        url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
        from: "高公局",
      },
      {
        id:   "CCTV-N1-S-72.675-M",
        name: "國道1號 南向 72.7K",
        loc:  "湖口段",
        src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=17260",
        type: "mjpeg",
        url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
        from: "高公局",
      },
      {
        id:   "CCTV-N1-S-78.600-M",
        name: "國道1號 南向 78.6K",
        loc:  "校前路段",
        src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=17860",
        type: "mjpeg",
        url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
        from: "高公局",
      },
      {
        id:   "CCTV-N1-S-82.900-M",
        name: "國道1號 南向 82.9K",
        loc:  "湖口交流道",
        src:  "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=18290",
        type: "mjpeg",
        url:  "https://www.freeway.gov.tw/RoadUserArea/CCTVLive",
        from: "高公局",
      },
      // 之後新增往下加 ...
    ];

    // ===== escape =====
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    // ===== render =====
    const grid = document.getElementById("grid");
    document.getElementById("count").textContent = CAMERAS.length;

    // MJPEG 播放策略:
    //   1. <img> 直連 MJPEG(瀏覽器原生支援,簡單可靠)
    //   2. 每收到一次 frame(onload),排 20 秒後自動重新指 src,
    //      預防中間 proxy 或 server timeout 凍結串流
    //   3. 失敗時指數退避(0.5/1/2/4/8s),5 次後放棄
    //   4. 黑屏期間 placeholder 顯示「重新連線中…」
    function attachMJPEG(url, body, placeholder) {
      const img = document.createElement("img");
      img.alt = "mjpeg";
      body.appendChild(img);

      let stopped = false;
      let attempts = 0;
      const MAX_ATTEMPTS = 5;
      let refreshTimer = null;
      let reconnectTimer = null;

      function showReconnecting(msg) {
        if (placeholder) {
          placeholder.textContent = msg;
          placeholder.style.display = "";
        }
        img.style.opacity = "0";
      }
      function showLive() {
        if (placeholder) placeholder.style.display = "none";
        img.style.opacity = "1";
      }
      function srcWithCacheBuster() {
        return url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
      }

      function reconnect() {
        if (stopped) return;
        attempts++;
        if (attempts > MAX_ATTEMPTS) {
          if (placeholder) placeholder.textContent = "無法連線";
          return;
        }
        showReconnecting("重新連線中…");
        img.src = srcWithCacheBuster();
        const delay = Math.min(8000, 500 * Math.pow(2, attempts - 1));
        reconnectTimer = setTimeout(reconnect, delay);
      }

      img.onload = () => {
        attempts = 0;
        showLive();
        // 收到 frame 後 20 秒主動重連一次,避免被凍結
        if (refreshTimer) clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => {
          if (stopped) return;
          showReconnecting("重新整理…");
          img.src = srcWithCacheBuster();
        }, 20000);
      };
      img.onerror = () => {
        if (stopped) return;
        reconnect();
      };

      img.src = url;

      return () => {
        stopped = true;
        if (refreshTimer) clearTimeout(refreshTimer);
        if (reconnectTimer) clearTimeout(reconnectTimer);
        img.src = "";
      };
    }

    CAMERAS.forEach(cam => {
      const div = document.createElement("div");
      div.className = "cam";
      div.innerHTML = `
        <div class="cam-head">
          <span class="cam-dot"></span>
          <span class="cam-name">${esc(cam.name)}</span>
          <span class="cam-loc">${esc(cam.loc)}</span>
        </div>
        <div class="cam-body" id="body-${esc(cam.id)}">
          <span class="placeholder">載入中…</span>
        </div>
        <div class="cam-foot">
          <span>${esc(cam.from)}</span>
          <a class="cam-link" href="${esc(cam.url)}" target="_blank" rel="noopener">高公局 ↗</a>
        </div>`;
      grid.appendChild(div);

      const body = div.querySelector(".cam-body");

      if (cam.type === "image") {
        const img = document.createElement("img");
        img.src = cam.src;
        img.alt = cam.name;
        img.loading = "lazy";
        img.onload = () => body.querySelector(".placeholder")?.remove();
        img.onerror = () => {
          body.querySelector(".placeholder").textContent = "影像載入失敗";
        };
        body.appendChild(img);
        // 靜態快照自動刷新
        setInterval(() => { img.src = cam.src + "?t=" + Date.now(); }, 8000);
      }

      if (cam.type === "mjpeg") {
        const placeholder = body.querySelector(".placeholder");
        attachMJPEG(cam.src, body, placeholder);
      }

      if (cam.type === "hls") {
        const video = document.createElement("video");
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        video.setAttribute("playsinline", "");
        body.appendChild(video);

        if (Hls.isSupported()) {
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          hls.loadSource(cam.src);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            body.querySelector(".placeholder")?.remove();
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) {
              body.querySelector(".placeholder").textContent = "串流載入失敗";
            }
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Safari 原生 HLS
          video.src = cam.src;
          video.addEventListener("loadeddata", () => {
            body.querySelector(".placeholder")?.remove();
          });
          video.addEventListener("error", () => {
            body.querySelector(".placeholder").textContent = "串流載入失敗";
          });
        } else {
          body.querySelector(".placeholder").textContent = "瀏覽器不支援 HLS";
        }
      }
    });
  </script>
</body>
</html>
